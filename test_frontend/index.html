<!DOCTYPE html>
<html>
<head>
</head>
<body>

  <textarea id="prompt" rows="4" cols="60" placeholder="Ask something..."></textarea>
  <br><br>
  <button onclick="sendMessage()">Send</button>

  <pre id="response" style="margin-top: 20px; font-size: 18px;"></pre>

  <script>
    async function sendMessage() {
      const output = document.getElementById("response");
      output.innerText = "";
      const prompt = document.getElementById("prompt").value;

      const response = await fetch("https://cubic-productive-cabinets-documentation.trycloudflare.com/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "qwen2.5:7b-instruct",
          prompt: prompt,
          stream: true
        })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.trim().split("\n");

        lines.forEach(line => {
          try {
            const json = JSON.parse(line);
            if (json.response) output.innerText += json.response;
          } catch (err) {
            console.error("JSON parse error", err);
          }
        });
      }
    }
  </script>
</body>
</html>
